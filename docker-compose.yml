services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket-support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
      POSTGRES_DB: ticket_support
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_support"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

